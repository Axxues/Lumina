<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Forgot Password | Lumina</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        brand: { 500: '#6366f1', 600: '#4f46e5' },
                    },
                    animation: {
                        'blob': 'blob 7s infinite',
                        'shine': 'shine 3s infinite linear',
                        'shake': 'shake 0.4s cubic-bezier(.36,.07,.19,.97) both',
                        'fade-in-up': 'fadeInUp 0.5s ease-out forwards',
                        'scale-in': 'scaleIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
                    },
                    keyframes: {
                        blob: {
                            '0%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                            '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                            '100%': { transform: 'translate(0px, 0px) scale(1)' },
                        },
                        shine: {
                            '0%': { transform: 'translateX(-100%)' },
                            '100%': { transform: 'translateX(100%)' },
                        },
                        shake: {
                            '10%, 90%': { transform: 'translate3d(-1px, 0, 0)' },
                            '20%, 80%': { transform: 'translate3d(2px, 0, 0)' },
                            '30%, 50%, 70%': { transform: 'translate3d(-4px, 0, 0)' },
                            '40%, 60%': { transform: 'translate3d(4px, 0, 0)' },
                        },
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(15px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        scaleIn: {
                            '0%': { opacity: '0', transform: 'scale(0.9)' },
                            '100%': { opacity: '1', transform: 'scale(1)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body { overflow: hidden; touch-action: none; }
        
        /* Floating Label Logic */
        .peer:focus ~ label,
        .peer:not(:placeholder-shown) ~ label {
            top: 0;
            transform: translateY(-50%);
            left: 0.8rem;
            font-size: 0.7rem;
            background-color: white;
            padding: 0 0.3rem;
            color: #6366f1;
            font-weight: 600;
        }
        
        /* Glass Panel */
        .glass-panel {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
        }

        .hover-lift { transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .hover-lift:hover { transform: translateY(-2px); }
        .hover-lift:active { transform: scale(0.97); }

        .input-animate { transition: all 0.2s ease; }
        .input-animate:focus { transform: scale(1.01); background-color: rgba(255,255,255,0.9); }
        
        .animation-delay-2000 { animation-delay: 2s; }
        .animation-delay-4000 { animation-delay: 4s; }
    </style>
</head>
<body class="bg-gray-50 h-[100dvh] w-screen flex items-center justify-center relative text-gray-800">

    <div class="fixed inset-0 w-full h-full overflow-hidden pointer-events-none -z-10 bg-gray-50">
        <div class="absolute top-0 left-0 w-72 h-72 bg-purple-300 rounded-full mix-blend-multiply filter blur-2xl opacity-70 animate-blob"></div>
        <div class="absolute top-0 right-0 w-72 h-72 bg-indigo-300 rounded-full mix-blend-multiply filter blur-2xl opacity-70 animate-blob animation-delay-2000"></div>
        <div class="absolute -bottom-32 left-20 w-72 h-72 bg-pink-300 rounded-full mix-blend-multiply filter blur-2xl opacity-70 animate-blob animation-delay-4000"></div>
    </div>

    <div class="relative w-[92%] max-w-[400px] glass-panel rounded-3xl overflow-hidden z-10 flex flex-col shadow-2xl animate-fade-in-up p-8">
        
        <div class="absolute top-0 left-0 w-full pt-4 text-center pointer-events-none">
            <div class="inline-flex items-center space-x-1.5 opacity-60">
                <i class="bi bi-layers-fill text-brand-600 text-xs"></i>
                <span class="text-[9px] font-bold tracking-[0.2em] uppercase text-gray-600">Zero Bloat UI</span>
            </div>
        </div>

        <div id="forgotFormView" class="w-full pt-6 flex flex-col justify-center transition-all duration-500">
            <div class="text-center mb-6">
                <div class="w-12 h-12 bg-brand-500/10 rounded-full flex items-center justify-center mx-auto mb-3 text-brand-600">
                    <i class="bi bi-key-fill text-xl"></i>
                </div>
                <h1 class="text-2xl font-bold text-gray-900 tracking-tight">Forgot Password?</h1>
                <p class="text-xs text-gray-600 mt-1 max-w-[260px] mx-auto">No worries, we'll send you reset instructions.</p>
            </div>

            <form id="forgotForm" novalidate class="space-y-4">
                <div class="relative group">
                    <input type="email" id="resetEmail" placeholder=" " required 
                        class="input-animate peer w-full h-12 bg-white/40 border border-gray-300/80 rounded-xl px-3 pl-10 outline-none focus:border-brand-500 focus:ring-4 focus:ring-brand-500/10 text-sm text-gray-700">
                    <label class="absolute left-10 top-1/2 -translate-y-1/2 text-gray-500 text-xs transition-all pointer-events-none rounded cursor-text origin-left">Email Address</label>
                    <i class="bi bi-envelope absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-500 peer-focus:text-brand-500 transition-colors text-sm"></i>
                    <i class="bi bi-check-circle-fill absolute right-3.5 top-1/2 -translate-y-1/2 text-green-500 opacity-0 transition-opacity validation-icon text-xs"></i>
                </div>

                <button type="submit" class="submit-btn hover-lift group relative w-full h-11 bg-brand-600 text-white rounded-xl font-semibold shadow-lg shadow-brand-500/20 overflow-hidden">
                    <div class="absolute top-0 left-0 w-full h-full bg-gradient-to-r from-transparent via-white/20 to-transparent -translate-x-full group-hover:animate-shine"></div>
                    <span class="btn-text relative z-10 text-sm transition-opacity duration-300">Reset Password</span>
                    
                    <div class="loading-spinner absolute inset-0 flex items-center justify-center opacity-0 transition-opacity duration-300 pointer-events-none">
                        <svg class="animate-spin w-5 h-5 text-white" viewBox="0 0 50 50">
                            <circle cx="25" cy="25" r="20" fill="none" stroke="currentColor" stroke-width="4"></circle>
                        </svg>
                    </div>
                </button>
            </form>

            <div class="text-center mt-6">
                <a href="index.html" class="inline-flex items-center text-xs font-semibold text-gray-500 hover:text-brand-600 transition-colors group">
                    <i class="bi bi-arrow-left mr-1 group-hover:-translate-x-1 transition-transform"></i>
                    Back to log in
                </a>
            </div>
        </div>

        <div id="successView" class="hidden w-full pt-10 flex-col justify-center items-center text-center animate-scale-in">
            <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mb-4 text-green-600 shadow-sm">
                <i class="bi bi-envelope-check-fill text-3xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-900 tracking-tight">Check your mail</h1>
            <p class="text-xs text-gray-600 mt-2 mb-6 max-w-[240px]">We have sent a password recover instructions to your email.</p>
            
            <button onclick="window.location.href='index.html'" class="hover-lift w-full h-11 bg-gray-900 text-white rounded-xl font-semibold shadow-lg text-sm mb-4">
                Open Email App
            </button>
            
            <button onclick="window.location.href='index.html'" class="text-xs font-semibold text-gray-500 hover:text-gray-800 transition-colors">
                Skip, I'll confirm later
            </button>
        </div>

    </div>

    <script>
        const form = document.getElementById('forgotForm');
        const emailInput = document.getElementById('resetEmail');
        const formView = document.getElementById('forgotFormView');
        const successView = document.getElementById('successView');
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        // Validation Logic
        emailInput.addEventListener('input', () => {
            const val = emailInput.value.trim();
            const parent = emailInput.parentElement;
            const icon = parent.querySelector('.validation-icon');
            
            if(val.length === 0) {
                emailInput.classList.remove('border-red-500', 'border-green-500');
                icon.classList.add('opacity-0');
                return;
            }

            if(emailRegex.test(val)) {
                emailInput.classList.remove('border-red-500');
                emailInput.classList.add('border-green-500');
                icon.classList.remove('opacity-0', 'text-red-500', 'bi-exclamation-circle-fill');
                icon.classList.add('text-green-500', 'bi-check-circle-fill');
            } else {
                emailInput.classList.remove('border-green-500');
                emailInput.classList.add('border-red-500');
                icon.classList.remove('opacity-0', 'text-green-500', 'bi-check-circle-fill');
                icon.classList.add('text-red-500', 'bi-exclamation-circle-fill');
            }
        });

        // Submit Logic
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const val = emailInput.value.trim();
            if(!emailRegex.test(val)) {
                // Shake error
                emailInput.parentElement.classList.add('animate-shake');
                setTimeout(() => emailInput.parentElement.classList.remove('animate-shake'), 400);
                if(val.length === 0) emailInput.classList.add('border-red-500');
                return;
            }

            // Loading State
            const btn = form.querySelector('.submit-btn');
            const btnText = btn.querySelector('.btn-text');
            const spinner = btn.querySelector('.loading-spinner');

            btnText.classList.add('opacity-0');
            spinner.classList.remove('opacity-0');
            btn.style.cursor = 'wait';
            
            // Mock API Delay -> Show Success
            setTimeout(() => {
                formView.style.opacity = '0';
                setTimeout(() => {
                    formView.classList.add('hidden');
                    successView.classList.remove('hidden');
                    successView.classList.add('flex');
                }, 200); // Wait for opacity fade
            }, 1500);
        });
    </script>
</body>
</html>
